<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>蓬勃·启示录训练</title>
<style>
/* ============ 主题变量 ============ */
:root{
  --bg:#f3f4f6; --surface:#ffffff; --surface2:#f8fafc; --text:#111827; --muted:#6b7280;
  --border:#e5e7eb; --primary:#2563eb; --ok:#15803d; --bad:#dc2626; --purple:#7c3aed;
  --ok-bg:#ecfdf5; --bad-bg:#fef2f2; --note-bg:#f5f3ff; --mark:#fef3c7;
  --shadow:0 1px 2px rgba(0,0,0,.06),0 6px 18px rgba(0,0,0,.05);
  --radius:14px;
}
:root[data-theme="dark"]{
  --bg:#0b1220; --surface:#162033; --surface2:#1e2a40; --text:#e5e7eb; --muted:#9ca3af;
  --border:#2b3a55; --primary:#60a5fa; --ok:#4ade80; --bad:#f87171; --purple:#c4b5fd;
  --ok-bg:#12301f; --bad-bg:#3a1a1d; --note-bg:#241f3d; --mark:#4a3b10;
  --shadow:0 1px 2px rgba(0,0,0,.4);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;min-height:100vh;display:flex;flex-direction:column;
  background:var(--bg);color:var(--text);line-height:1.6;font-size:16px;
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans SC","Segoe UI",Roboto,sans-serif;
}
[hidden]{display:none!important}
button,input,select,textarea{font:inherit;color:inherit}

/* ============ 顶栏 / 页脚 ============ */
.topbar{position:sticky;top:0;z-index:20;background:var(--surface);border-bottom:1px solid var(--border);
  padding-top:env(safe-area-inset-top)}
.topbar-inner{max-width:960px;margin:0 auto;padding:8px 14px;display:flex;align-items:center;justify-content:space-between;gap:10px}
.brand{background:none;border:0;padding:6px 0;cursor:pointer;font-size:1.15rem;font-weight:700;color:var(--primary)}
.brand span{font-weight:500;color:var(--text)}
.top-actions{display:flex;align-items:center;gap:8px}
.icon-btn{width:40px;height:40px;border-radius:50%;border:1px solid var(--border);background:var(--surface2);cursor:pointer;font-size:1.1rem;line-height:1}
footer{margin-top:auto;padding:18px 14px calc(18px + env(safe-area-inset-bottom));text-align:center;color:var(--muted);font-size:.85rem}

/* ============ 布局 ============ */
main{width:100%;flex:1}
.container{width:100%;max-width:880px;margin:0 auto;padding:16px 14px 24px}
.container.narrow{max-width:760px}
.container.wide{max-width:960px}
.page-title{font-size:1.5rem;font-weight:800;text-align:center;margin:6px 0 18px}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);padding:18px;margin-bottom:14px}
.card h2{font-size:1.1rem;margin:0 0 6px}
.card .desc{margin:0 0 14px;color:var(--muted);font-size:.95rem}
.card.type-card{display:flex;flex-direction:column;margin-bottom:0}
.card.type-card .btn{margin-top:auto}
.stat{font-size:.85rem;color:var(--muted);margin:-6px 0 12px}
.row-between{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.muted{color:var(--muted)}
.small{font-size:.85rem}
.label{display:block;font-size:.9rem;color:var(--muted);margin:12px 0 6px}
.label:first-child{margin-top:0}

/* ============ 按钮 / 表单 ============ */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;padding:0 18px;border:1px solid transparent;
  border-radius:10px;background:var(--primary);color:#fff;font-weight:600;cursor:pointer;text-align:center;
  transition:filter .15s,transform .05s;user-select:none}
.btn:active{transform:scale(.98)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn-green{background:#16a34a}.btn-purple{background:#7c3aed}.btn-red{background:#dc2626}
.btn-gray{background:var(--surface2);color:var(--text);border-color:var(--border)}
.btn-ghost{background:transparent;color:var(--text);border-color:var(--border)}
.btn-sm{min-height:36px;padding:0 12px;font-size:.9rem;border-radius:8px}
.btn-block{width:100%}
@media (hover:hover){.btn:not(:disabled):hover{filter:brightness(1.1)}}
.back{margin-bottom:10px}

.seg{display:flex;gap:8px}
.seg-btn{flex:1;min-height:48px;padding:6px 10px;border:1px solid var(--border);border-radius:10px;background:var(--surface2);
  cursor:pointer;font-weight:600;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.25}
.seg-btn small{font-weight:400;color:var(--muted);font-size:.78rem}
.seg-btn.on{background:var(--primary);border-color:var(--primary);color:#fff}
.seg-btn.on small{color:rgba(255,255,255,.85)}
.seg-btn:disabled{opacity:.5;cursor:not-allowed}

.input,.select,.textarea{width:100%;min-height:44px;padding:9px 12px;border:1px solid var(--border);border-radius:10px;
  background:var(--surface);font-size:16px}
.textarea{resize:vertical;line-height:1.7}
.input:focus,.select:focus,.textarea:focus,.blank:focus{outline:2px solid var(--primary);outline-offset:1px}
.grid-3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.two-col{display:grid;grid-template-columns:1fr 1fr;gap:12px}

/* ============ 测试页 ============ */
.quiz-head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:10px}
.tag{display:inline-block;padding:2px 10px;border-radius:999px;background:var(--surface2);border:1px solid var(--border);font-size:.82rem;color:var(--muted)}
.vtag{display:inline-block;padding:2px 10px;border-radius:999px;background:var(--primary);color:#fff;font-size:.82rem;font-weight:600}
:root[data-theme="dark"] .vtag{color:#0b1220}
.quiz-meta{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;font-size:.92rem;color:var(--muted)}
.progress{height:6px;border-radius:99px;background:var(--surface2);overflow:hidden;margin-bottom:16px}
.progress i{display:block;height:100%;background:var(--primary);border-radius:99px;transition:width .25s}
.prompt{margin:0 0 10px;font-weight:600}
.qtext{font-size:1.1rem;line-height:2.1;white-space:pre-wrap;word-break:break-word}
.qtext.plain{line-height:1.8}
.blank{font:inherit;text-align:center;border:0;border-bottom:2px solid var(--primary);background:var(--surface2);
  border-radius:6px 6px 0 0;padding:1px 4px;min-height:1.9em;margin:0 3px;max-width:100%;vertical-align:baseline}
.blank.ok{border-color:#16a34a;background:var(--ok-bg)}
.blank.bad{border-color:var(--bad);background:var(--bad-bg)}
.panel{margin-top:16px;padding:12px 14px;border-radius:10px;background:var(--surface2);border:1px solid var(--border)}
.panel h4{margin:0 0 6px;font-size:.82rem;color:var(--muted);font-weight:600}
.panel.ref{border-left:4px solid var(--purple);background:var(--note-bg)}
.panel .txt{white-space:pre-wrap;word-break:break-word;line-height:1.8}
.fb{padding:0 3px;border-radius:4px;font-weight:600}
.fb.ok{background:var(--ok-bg);color:var(--ok)}
.fb.bad{background:var(--bad-bg);color:var(--bad)}
.fb s{opacity:.7;font-weight:400;margin-right:4px}
.hint-pre{font-weight:700;color:var(--primary)}
.score-line{margin-top:10px;padding-top:10px;border-top:1px dashed var(--border);font-weight:600}
.actions{display:flex;gap:10px;flex-wrap:wrap}
.actions .btn{flex:1 1 0;min-width:96px}
.actions .wide{flex-basis:100%}
.actions.sticky{position:sticky;bottom:0;z-index:10;padding:10px 0 calc(10px + env(safe-area-inset-bottom));
  background:linear-gradient(to bottom,transparent,var(--bg) 28%)}

/* ============ 结果页 ============ */
.result-head{text-align:center;margin-bottom:12px}
.result-head h2{margin:0 0 4px;font-size:1.4rem}
.scorebox{display:flex;justify-content:center;gap:28px;padding:12px;margin:12px 0;background:var(--surface2);border:1px solid var(--border);border-radius:12px}
.scorebox b{display:block;font-size:1.5rem}
.good{color:var(--ok)}.poor{color:var(--bad)}
.item{padding:14px 0;border-top:1px solid var(--border)}
.item:first-of-type{border-top:0}
.item .item-title{font-size:.85rem;font-weight:600;color:var(--muted);margin-bottom:6px}

/* ============ 编辑器 ============ */
.toolbar{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}
.toolbar .input{flex:1 1 200px}
.row{display:flex;gap:10px;justify-content:space-between;align-items:flex-start;padding:12px 0;border-top:1px solid var(--border)}
.row:first-of-type{border-top:0}
.row-main{min-width:0;flex:1}
.row-top{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:4px;font-size:.82rem;color:var(--muted)}
.row-q{margin:0;word-break:break-word}
.row-a{margin:4px 0 0;color:var(--muted);font-size:.92rem;word-break:break-word}
.row-actions{display:flex;gap:6px;flex-shrink:0}
mark{background:var(--mark);color:inherit;border-radius:3px;padding:0 1px}
.pager{display:flex;justify-content:center;align-items:center;gap:12px;margin-top:12px}
.preview{margin-top:8px;font-size:.88rem;color:var(--muted)}
.preview b{color:var(--text)}
.empty{text-align:center;color:var(--muted);padding:26px 0}

/* ============ 首页：题库管理说明条 / 密码弹窗 ============ */
.admin-box{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-top:30px;padding:14px 16px;
  border:1px dashed var(--border);border-radius:var(--radius);color:var(--muted)}
.admin-box strong{color:var(--text);font-size:.95rem}
.admin-box p{margin:2px 0 0;font-size:.85rem;line-height:1.5}
.admin-box .btn{flex-shrink:0}
.lock{font-size:.8em;opacity:.75;margin-left:4px}
.modal{position:fixed;inset:0;z-index:60;background:rgba(15,23,42,.55);display:flex;align-items:center;justify-content:center;padding:20px}
.modal-box{width:100%;max-width:360px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:20px;box-shadow:0 12px 40px rgba(0,0,0,.35)}
.modal-box h3{margin:0 0 4px;font-size:1.1rem}
.modal-box .err{min-height:1.4em;margin:6px 0 0;color:var(--bad);font-size:.88rem}
.modal-box .actions{margin-top:10px}
@keyframes shake{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}
.shake{animation:shake .3s}
@media (max-width:860px){.grid-3{grid-template-columns:1fr}}
@media (max-width:720px){.admin-box{flex-direction:column;align-items:stretch;text-align:left}}

/* ============ Toast ============ */
#toast{position:fixed;left:50%;bottom:calc(28px + env(safe-area-inset-bottom));transform:translate(-50%,16px);z-index:99;
  max-width:min(92vw,560px);padding:10px 16px;border-radius:10px;background:#111827;color:#fff;font-size:.92rem;opacity:0;
  pointer-events:none;transition:opacity .2s,transform .2s;box-shadow:0 6px 24px rgba(0,0,0,.3)}
#toast.show{opacity:1;transform:translate(-50%,0)}
#toast[data-type="error"]{background:#b91c1c}
#toast[data-type="success"]{background:#15803d}

/* ============ 动画（仅轻微淡入） ============ */
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
#app:not(.still)>*{animation:fade .22s ease}
@media (prefers-reduced-motion:reduce){#app>*{animation:none!important}.progress i{transition:none}}

/* ============ 手机适配 ============ */
@media (max-width:720px){
  .grid-2,.grid-3{grid-template-columns:1fr}
  .card{padding:15px}
  .row{flex-direction:column}
  .row-actions{width:100%}
  .row-actions .btn{flex:1}
  .qtext{font-size:1.05rem}
  .scorebox{gap:18px}
}
@media (max-width:420px){
  .two-col{grid-template-columns:1fr}
  .brand{font-size:1.02rem}
}

/* ============ 打印 / 另存为 PDF：只保留结果区 ============ */
@media print{
  .topbar,footer,.back,.result-actions,#toast{display:none!important}
  body{background:#fff;color:#000}
  .container{max-width:none;padding:0}
  .card{box-shadow:none;border:0;padding:0}
  .item{break-inside:avoid}
}
</style>
</head>
<body>
<header class="topbar">
  <div class="topbar-inner">
    <button class="brand" id="brandBtn" type="button">蓬勃 <span>· 启示录训练</span></button>
    <div class="top-actions">
      <button class="btn btn-ghost btn-sm" id="homeBtn" type="button" hidden>首页</button>
      <button class="icon-btn" id="themeBtn" type="button" aria-label="切换深色/浅色">🌙</button>
    </div>
  </div>
</header>

<main id="app"></main>

<footer>我听见以色列人各支派中受印的数目有十四万四千...</footer>
<div id="toast" role="status" aria-live="polite"></div>
<div class="modal" id="pwModal" hidden>
  <div class="modal-box" role="dialog" aria-modal="true" aria-labelledby="pwTitle">
    <h3 id="pwTitle">请输入密码</h3>
    <p class="muted small" style="margin:0 0 10px" id="pwHint"></p>
    <input class="input" id="pwInput" type="password" autocomplete="off" autocapitalize="off" placeholder="密码" enterkeyhint="done">
    <p class="err" id="pwErr" role="alert"></p>
    <div class="actions">
      <button class="btn btn-gray" id="pwCancel" type="button">取消</button>
      <button class="btn" id="pwOk" type="button">确定</button>
    </div>
  </div>
</div>

<script id="__BANK_OVERRIDE__" type="application/json">{"_version":2,"_updated":"2026-11-10T23:07:31.000Z","fillEasy":[{"id":1,"chapter":1,"verse":"启1:1","question":"（耶稣基督）的启示，就是神赐给他，叫他将（必要快成）的事指示他的众仆人。他就差遣使者，晓谕他的仆人（约翰）。","answers":["耶稣基督","必要快成","约翰"]},{"id":2,"chapter":1,"verse":"启1:3","question":"念这书上（预言）的，和那些（听见）又（遵守）其中所记载的，都是有福的。因为日期近了。","answers":["预言","听见","遵守"]},{"id":3,"chapter":1,"verse":"启1:7","question":"看哪，他（驾云降临）。众目要看见他，连（刺他的人）也要看见他。地上的万族都要因他（哀哭）。这话是真实的。阿们。","answers":["驾云降临","刺他的人","哀哭"]},{"id":4,"chapter":1,"verse":"启1:8","question":"主神说，我是（阿拉法），我是（俄梅戛），是（昔在今在以后永在）的全能者。","answers":["阿拉法","俄梅戛","昔在今在以后永在"]},{"id":5,"chapter":1,"verse":"启1:16","question":"他（右手）拿着（七星）。从他口中出来一把（两刃的利剑）。面貌如同（烈日放光）。","answers":["右手","七星","两刃的利剑","烈日放光"]},{"id":6,"chapter":1,"verse":"启1:17-18","question":"我一看见，就仆倒在他脚前，像死了一样。他用右手按着我说，不要（惧怕）。我是首先的，我是末后的，又是那（存活）的。我曾（死过），现在又（活了），直活到永永远远。并且拿着死亡和阴间的钥匙。","answers":["惧怕","存活","死过","活了"]},{"id":7,"chapter":2,"verse":"启2:7","question":"圣灵向（众教会）所说的话，凡有耳的，就应当（听）。得胜的，我必将神（乐园）中（生命树）的果子赐给他（吃）。","answers":["众教会","听","乐园","生命树","吃"]},{"id":8,"chapter":2,"verse":"启2:10","question":"你将要受的苦你不用怕。魔鬼要把你们中间几个人下在（监里），叫你们被（试炼）。你们必受患难（十日）。你务要至死（忠心），我就赐给你那生命的冠冕。","answers":["监里","试炼","十日","忠心"]},{"id":9,"chapter":2,"verse":"启2:11","question":"圣灵向众教会所说的话，凡有耳的，就应当听。得胜的，必不受（第二次死）的害。","answers":["第二次死"]},{"id":10,"chapter":2,"verse":"启2:17","question":"圣灵向众教会所说的话，凡有耳的就应当听。得胜的，我必将那（隐藏的吗哪）赐给他。并赐他一块（白石），石上写着（新名）。除了那领受的以外。没有人能认识。","answers":["隐藏的吗哪","白石","新名"]},{"id":11,"chapter":3,"verse":"启3:5","question":"凡得胜的，必这样穿（白衣）。我也必不从（生命册）上涂抹他的名。且要在我（父）面前，和我父众使者面前认他的名。","answers":["白衣","生命册","父"]},{"id":12,"chapter":3,"verse":"启3:8","question":"我知道你的行为，你略有（一点力量），也曾（遵守）我的道，没有（弃绝）我的名。看哪，我在你面前给你一个（敞开的门），是无人能关的。","answers":["一点力量","遵守","弃绝","敞开的门"]},{"id":13,"chapter":3,"verse":"启3:11","question":"我必（快来），你要（持守）你所有的，免得人（夺去）你的冠冕。","answers":["快来","持守","夺去"]},{"id":14,"chapter":3,"verse":"启3:20","question":"看哪，我站在（门外）叩门。若有听见我声音就（开门）的，我要（进到）他那里去，我与他，他与我一同（坐席）。","answers":["门外","开门","进到","坐席"]},{"id":15,"chapter":3,"verse":"启3:21","question":"得胜的，我要赐他在我（宝座）上与我同坐，就如我得了胜，在我（父）的宝座上与他同坐一般。","answers":["宝座","父"]},{"id":16,"chapter":4,"verse":"启4:1","question":"此后，我观看，见（天上）有门开了，我初次听见好像（吹号）的声音，对我说，你上到这里来，我要将（以后必成）的事指示你。","answers":["天上","吹号","以后必成"]},{"id":17,"chapter":4,"verse":"启4:4","question":"宝座的周围，又有（二十四）个座位，其上坐着（二十四）位长老，身穿（白衣），头上戴着（金冠冕）。","answers":["二十四","二十四","白衣","金冠冕"]},{"id":18,"chapter":4,"verse":"启4:8","question":"四活物各有（六个翅膀），遍体内外都满了（眼睛）。他们昼夜不住地说，（圣哉），圣哉，圣哉，主神。是昔在今在以后永在的（全能者）。","answers":["六个翅膀","眼睛","圣哉","全能者"]},{"id":19,"chapter":5,"verse":"启5:5","question":"长老中有一位对我说，不要哭。看哪，（犹大）支派中的（狮子），大卫的根，他已得胜，能以展开那书卷，揭开那（七印）。","answers":["犹大","狮子","七印"]},{"id":20,"chapter":5,"verse":"启5:9","question":"他们唱（新歌），说，你配拿书卷，配揭开七印。因为你曾被杀，用自己的（血）从各族各方，各民各国中买了人来，叫他们归于（神）。","answers":["新歌","血","神"]},{"id":21,"chapter":6,"verse":"启6:8","question":"我就观看，见有一匹（灰色马）。骑在马上的，名字叫作（死）。阴府也随着他。有权柄赐给他们，可以用（刀剑），饥荒，瘟疫(瘟疫或作死亡)，野兽，杀害地上四分之一的人。","answers":["灰色马","死","刀剑"]},{"id":22,"chapter":7,"verse":"启7:9","question":"此后，我观看，见有许多的人，没有人能数过来，是从各（国）各（族）各（民）各方来的，站在宝座和羔羊面前，身穿（白衣），手拿（棕树枝）。","answers":["国","族","民","白衣","棕树枝"]},{"id":23,"chapter":7,"verse":"启7:14","question":"我对他说，我主，你知道。他向我说，这些人是从（大患难）中出来的，曾用（羔羊的血），把衣裳（洗白净了）。","answers":["大患难","羔羊的血","洗白净了"]},{"id":24,"chapter":7,"verse":"启7:17","question":"因为宝座中的（羔羊）必牧养他们，领他们到（生命水）的泉源。神也必擦去他们一切的（眼泪）。","answers":["羔羊","生命水","眼泪"]},{"id":25,"chapter":12,"verse":"启12:11","question":"弟兄胜过它，是因（羔羊的血），和自己所（见证的道）。他们虽至于死，也不（爱惜性命）。","answers":["羔羊的血","见证的道","爱惜性命"]},{"id":26,"chapter":13,"verse":"启13:8","question":"凡住在地上，名字从（创世以来），没有记在被杀之（羔羊）生命册上的人，都要（拜它）。","answers":["创世以来","羔羊","拜它"]},{"id":27,"chapter":14,"verse":"启14:13","question":"我听见从天上有声音说，你要写下，从今以后，在（主里面）而死的人有（福）了。圣灵说，是的，他们（息了自己的劳苦），作工的果效也（随着他们）。","answers":["主里面","福","息了自己的劳苦","随着他们"]},{"id":28,"chapter":19,"verse":"启19:7","question":"我们要（欢喜快乐），将荣耀归给他。因为（羔羊）婚娶的时候到了，新妇也自己（预备好了）。","answers":["欢喜快乐","羔羊","预备好了"]},{"id":29,"chapter":20,"verse":"启20:12","question":"我又看见死了的人，无论大小，都站在宝座前。案卷展开了。并且另有一卷展开，就是（生命册）。死了的人都凭着这些案卷所记载的，照他们所行的受（审判）。","answers":["生命册","审判"]},{"id":30,"chapter":21,"verse":"启21:4","question":"神要擦去他们一切的眼泪。不再有（死亡），也不再有（悲哀），哭号，疼痛，因为（以前的事）都（过去了）。","answers":["死亡","悲哀","以前的事","过去了"]},{"id":31,"chapter":21,"verse":"启21:6","question":"他又对我说，都成了。我是（阿拉法），我是（俄梅戛），我是（初），我是（终）。我要将生命泉的水白白赐给那口渴的人喝。","answers":["阿拉法","俄梅戛","初","终"]},{"id":32,"chapter":22,"verse":"启22:17","question":"（圣灵）和（新妇）都说来。听见的人也该说（来）。口渴的人也当来。（愿意）的都可以白白取生命的水喝。","answers":["圣灵","新妇","来","愿意"]},{"id":33,"chapter":22,"verse":"启22:20","question":"证明这事的说，是了。我必（快来）。阿们。主耶稣阿，我愿你（来）。","answers":["快来","来"]},{"id":34,"chapter":1,"verse":"启1:10","question":"当（主日）我被（圣灵感动），听见在我后面有（大声音）如吹号说。","answers":["主日","圣灵感动","大声音"]},{"id":35,"chapter":2,"verse":"启2:1","question":"你要写信给（以弗所）教会的使者，说，那右手拿着（七星），在（七个金灯台）中间行走的，说。","answers":["以弗所","七星","七个金灯台"]},{"id":36,"chapter":19,"verse":"启19:1","question":"此后，我听见（群众的大声音）在天上大声说：“哈利路亚(就是“要赞美耶和华”的意思)！救恩、荣耀、权能都属乎我们的 神。","answers":["群众的大声音"]},{"id":37,"chapter":19,"verse":"启19:2","question":"他的判断是（真实公义）的，因他判断了那用淫行败坏世界的大淫妇，并且向淫妇讨流仆人血的罪，给他们伸冤。”","answers":["真实公义"]},{"id":38,"chapter":19,"verse":"启19:3","question":"又说：“哈利路亚！（烧淫妇的烟）往上冒，直到永永远远。”","answers":["烧淫妇的烟"]},{"id":39,"chapter":19,"verse":"启19:5","question":"有声音从宝座出来说：“ 神的众仆人哪，凡（敬畏）他的，无论大小，都要赞美我们的 神。”","answers":["敬畏"]},{"id":40,"chapter":19,"verse":"启19:6","question":"我听见好像群众的声音，众水的声音，大雷的声音，说：“哈利路亚！因为主我们的 神，全能者（作王了）。”","answers":["作王了"]},{"id":41,"chapter":19,"verse":"启19:7","question":"我们要欢喜快乐，将荣耀归给他。因为（羔羊婚娶）的时候到了，新妇也自己预备好了，","answers":["羔羊婚娶"]},{"id":42,"chapter":19,"verse":"启19:8","question":"就蒙恩得穿光明洁白的细麻衣。这细麻衣就是（圣徒所行的义）。","answers":["圣徒所行的义"]},{"id":43,"chapter":19,"verse":"启19:9","question":"天使吩咐我说：“你要写上，凡被请赴（羔羊之婚宴的）有福了！”又对我说：“这是 神真实的话。”","answers":["羔羊之婚宴的"]},{"id":44,"chapter":19,"verse":"启19:10","question":"我就俯伏在他脚前要拜他，他说：“千万不可！我和你，并你那些为耶稣作见证的弟兄同是作仆人的，你要敬拜 神。”因为（预言中的灵）乃是为耶稣作见证。","answers":["预言中的灵"]},{"id":45,"chapter":19,"verse":"启19:12","question":"他的眼睛如火焰，他头上戴着（许多冠冕），又有写着的名字，除了他自己没有人知道。","answers":["许多冠冕"]},{"id":46,"chapter":19,"verse":"启19:13","question":"他穿着（溅了血）的衣服，他的名称为神之道。","answers":["溅了血"]},{"id":47,"chapter":19,"verse":"启19:14","question":"在天上的众军骑着白马，穿着（细麻衣），又白又洁，跟随他。","answers":["细麻衣"]},{"id":48,"chapter":19,"verse":"启19:15","question":"有（利剑）从他口中出来，可以击杀列国。他必用铁杖辖管(“辖管”原文作“牧”)他们，并要踹全能 神烈怒的酒榨。","answers":["利剑"]},{"id":49,"chapter":19,"verse":"启19:16","question":"在他衣服和大腿上有名写着说：“（万王之王，万主之主）。”","answers":["万王之王，万主之主"]},{"id":50,"chapter":19,"verse":"启19:17","question":"我又看见一位天使站在日头中，向天空（飞的鸟）大声喊着说：“你们聚集来赴神的大筵席，","answers":["飞的鸟"]},{"id":51,"chapter":19,"verse":"启19:18","question":"可以吃（君王的肉），壮士与马和骑马者的肉，并一切自主的为奴的，以及大小人民的肉。”","answers":["君王的肉"]},{"id":52,"chapter":19,"verse":"启19:20","question":"那兽被擒拿，那在兽面前曾行奇事、迷惑受兽印记和拜兽像之人的假先知，也与兽同被擒拿。他们两个就活活地被扔在（烧着硫磺的火湖里）；","answers":["烧着硫磺的火湖里"]},{"id":53,"chapter":19,"verse":"启19:21","question":"其余的被骑白马者口中出来的剑杀了。飞鸟都吃饱了（他们的肉）。","answers":["他们的肉"]},{"id":54,"chapter":8,"verse":"启8:8","question":"第二位天使吹号，就有仿佛（火烧着的大山）扔在海中；（海的三分之一）变成（血）","answers":["火烧着的大山","海的三分之一","血"]},{"id":55,"chapter":8,"verse":"启8:9","question":"海中的（活物）死了三分之一，（船只）也坏了三分之一。","answers":["活物","船只"]},{"id":56,"chapter":8,"verse":"启8:10","question":"第三位天使吹号，就有（烧着的大星），（好像火把）从天上落下来，落在（江河的三分之一和众水的泉源）上。","answers":["烧着的大星","好像火把","江河的三分之一和众水的泉源"]},{"id":57,"chapter":8,"verse":"启8:11","question":"这星名叫（“茵陈”）。（众水）的三分之一变为茵陈，因水变苦，就死了（许多人）。","answers":["“茵陈”","众水","许多人"]},{"id":58,"chapter":8,"verse":"启8:13","question":"我又看见一个（鹰）飞在空中，并听见它大声说：“三位天使要吹那其余的号。你们（住在地上的民），祸哉！祸哉！祸哉！”","answers":["鹰","住在地上的民"]}],"fillHard":[{"id":101,"chapter":1,"verse":"启1:1-2","question":"（耶稣基督）的启示，就是神赐给他，叫他将（必要快成）的事指示他的众仆人。他就差遣（使者），晓谕他的仆人（约翰）。约翰便将神的道，和耶稣基督的见证，凡自己所看见的，都（证明）出来。","answers":["耶稣基督","必要快成","使者","约翰","证明"]},{"id":102,"chapter":1,"verse":"启1:3-4","question":"（念）这书上预言的，和那些（听见）又（遵守）其中所记载的，都是有福的。因为（日期近了）。约翰写信给亚西亚的（七个教会）。但愿从那昔在今在以后永在的神和他宝座前的七灵。","answers":["念","听见","遵守","日期近了","七个教会"]},{"id":103,"chapter":1,"verse":"启1:5-6","question":"并那诚实作（见证）的，从死里（首先复活），为世上（君王元首）的耶稣基督。有恩惠平安归与你们。他（爱）我们，用自己的（血）使我们脱离罪恶。又使我们成为（国民），作他父神的（祭司）。但愿荣耀权能归给他，直到永永远远。阿们。","answers":["见证","首先复活","君王元首","爱","血","国民","祭司"]},{"id":104,"chapter":1,"verse":"启1:7-8","question":"看哪，他（驾云降临）。众目要看见他，连（刺他的人）也要看见他。地上的万族都要因他（哀哭）。这话是真实的。阿们。主神说，我是（阿拉法），我是（俄梅戛），是昔在今在以后永在的全能者。","answers":["驾云降临","刺他的人","哀哭","阿拉法","俄梅戛"]},{"id":105,"chapter":1,"verse":"启1:9-10","question":"我约翰就是你们的（弟兄），和你们在耶稣的（患难），国度，忍耐里一同有分。为神的道，并为给耶稣作的见证，曾在那名叫（拔摩）的海岛上。当（主日）我被圣灵感动，听见在我后面有大声音如吹号说，","answers":["弟兄","患难","拔摩","主日"]},{"id":106,"chapter":2,"verse":"启2:1-2","question":"你要写信给（以弗所）教会的使者，说，那右手拿着七星，在七个金灯台中间行走的，说，我知道你的（行为），劳碌，忍耐，也知道你不能容忍（恶人），你也曾试验那自称为使徒却不是使徒的，看出他们是（假）的来。","answers":["以弗所","行为","恶人","假"]},{"id":107,"chapter":2,"verse":"启2:3-5","question":"你也能（忍耐），曾为我的名（劳苦），并不乏倦。然而有一件事我要责备你，就是你把起初的（爱心）离弃了。所以应当回想你是从哪里（坠落）的，并要悔改，行起初所行的事。你若不悔改，我就临到你那里，把你的灯台从原处（挪去）。","answers":["忍耐","劳苦","爱心","坠落","挪去"]},{"id":108,"chapter":2,"verse":"启2:7","question":"圣灵向（众教会）所说的话，凡有耳的，就应当（听）。得胜的，我必将神（乐园）中（生命树）的果子赐给他（吃）。","answers":["众教会","听","乐园","生命树","吃"]},{"id":109,"chapter":2,"verse":"启2:10-11","question":"你将要受的苦你不用（怕）。魔鬼要把你们中间几个人下在（监里），叫你们被（试炼）。你们必受患难（十日）。你务要至死（忠心），我就赐给你那生命的冠冕。圣灵向众教会所说的话，凡有耳的，就应当听。得胜的，必不受（第二次死）的害。","answers":["怕","监里","试炼","十日","忠心","第二次死"]},{"id":110,"chapter":3,"verse":"启3:1-3","question":"你要写信给（撒狄）教会的使者，说，那有神的七灵和七星的，说，我知道你的行为，按名你是（活）的，其实是（死）的。你要儆醒，坚固那剩下将要衰微的。因我见你的行为，在我神面前，没有一样是（完全）的。所以要回想你是怎样（领受），怎样听见的。又要遵守，并要悔改。若不儆醒，我必临到你那里如同（贼）一样。我几时临到，你也决不能知道。","answers":["撒狄","活","死","完全","领受","贼"]},{"id":111,"chapter":3,"verse":"启3:5","question":"凡（得胜）的，必这样穿（白衣）。我也必不从（生命册）上涂抹他的名。且要在我（父）面前，和我父众使者面前认他的名。","answers":["得胜","白衣","生命册","父"]},{"id":112,"chapter":3,"verse":"启3:7-8","question":"你要写信给（非拉铁非）教会的使者，说，那（圣洁），（真实），拿着大卫的钥匙，开了就没有人能关，关了就没有人能开的，说，我知道你的行为，你略有（一点力量），也曾遵守我的道，没有弃绝我的名。看哪，我在你面前给你一个（敞开的门），是无人能关的。","answers":["非拉铁非","圣洁","真实","一点力量","敞开的门"]},{"id":113,"chapter":3,"verse":"启3:10-11","question":"你既遵守我（忍耐的道），我必在普天下人受试炼的时候，（保守）你免去你的试炼。我必（快来），你要持守你所有的，免得人（夺去）你的冠冕。","answers":["忍耐的道","保守","快来","夺去"]},{"id":114,"chapter":3,"verse":"启3:14-16","question":"你要写信给（老底嘉）教会的使者，说，那为（阿们）的，为诚信真实见证的，在神创造万物之上为元首的,说,我知道你的行为，你也不（冷）也不（热）。我巴不得你或冷或热。你既如（温水），也不冷也不热，所以我必从我口中把你吐出去。","answers":["老底嘉","阿们","冷","热","温水"]},{"id":115,"chapter":3,"verse":"启3:17-18","question":"你说，我是（富足），已经发了财，一样都不缺。却不知道你是那（困苦），可怜，（贫穷），瞎眼，赤身的。我劝你向我买（火炼的金子），叫你富足。又买（白衣）穿上，叫你赤身的羞耻不露出来。又买（眼药）擦你的眼睛，使你能看见。","answers":["富足","困苦","贫穷","火炼的金子","白衣","眼药"]},{"id":116,"chapter":3,"verse":"启3:19-20","question":"凡我所（疼爱）的，我就（责备管教）他。所以你要发（热心），也要悔改。看哪，我站在（门外）叩门。若有听见我声音就（开门）的，我要进到他那里去，我与他，他与我一同坐席。","answers":["疼爱","责备管教","热心","门外","开门"]},{"id":117,"chapter":3,"verse":"启3:21-22","question":"（得胜）的，我要赐他在我（宝座）上与我同坐，就如我得了胜，在我父的宝座上与他同坐一般。（圣灵）向众教会所说的话，凡有（耳）的，就应当听。","answers":["得胜","宝座","圣灵","耳"]},{"id":118,"chapter":4,"verse":"启4:1-2","question":"此后，我观看，见（天上）有门开了，我初次听见好像吹号的声音，对我说，你上到这里来，我要将（以后必成）的事指示你。我立刻被（圣灵）感动，见有一个（宝座）安置在天上，又有一位坐在宝座上。","answers":["天上","以后必成","圣灵","宝座"]},{"id":119,"chapter":4,"verse":"启4:4","question":"宝座的周围，又有（二十四）个座位，其上坐着（二十四）位长老，身穿（白衣），头上戴着（金冠冕）。","answers":["二十四","二十四","白衣","金冠冕"]},{"id":120,"chapter":4,"verse":"启4:8","question":"四活物各有（六个翅膀），遍体内外都满了（眼睛）。他们昼夜不住地说，（圣哉），圣哉，圣哉，主神。是昔在今在以后永在的（全能者）。","answers":["六个翅膀","眼睛","圣哉","全能者"]}],"qaEasy":[{"id":1,"chapter":8,"verse":"启8:8","question":"火烧着的大山是？","answer":"被神震怒之话语审判的背道的七个金灯台帐幕"},{"id":2,"chapter":8,"verse":"启8:8","question":"扔在海中指？","answer":"被丢弃到世上"},{"id":3,"chapter":8,"verse":"启8:8","question":"海 1/3 → 血:","answer":"(被审判的七个金灯台帐幕成为世界的所属)在那里传出的话语 1/3掺杂了灭亡者的教训成为了死的教理"},{"id":4,"chapter":8,"verse":"启8:9","question":"活物 1/3 → 死了:","answer":"七个金灯台帐幕的枝教会圣徒们听了灭亡者的教理，灵死去"},{"id":5,"chapter":8,"verse":"启8:9","question":"船只 1/3 → 坏了:","answer":"七个金灯台帐幕枝教会 1/3也成为了世界所属而倾倒"},{"id":6,"chapter":8,"verse":"启8:10","question":"从天上落下来的烧着的大星:","answer":"七个金灯台帐幕出身，与灭亡者合一结党的肉体"},{"id":7,"chapter":8,"verse":"启8:10","question":"河, 众水的泉源:","answer":"进入外邦巢穴的七个金灯台帐幕的传道者和牧者"},{"id":8,"chapter":8,"verse":"启8:11","question":"这星名叫茵陈的理由:","answer":"因为说出非真理(申 32:31-33, 耶 9:15, 耶 23:15)"},{"id":9,"chapter":8,"verse":"启8:11","question":"众水 1/3 → 变为茵陈:","answer":"背道的帐幕枝教会的传道者和牧者1/3受到了茵陈星即帐幕出身的灭亡者的迷惑，传讲撒但的教理"},{"id":10,"chapter":8,"verse":"启8:11","question":"死了的许多人是？","answer":"七个金灯台帐幕圣徒们"},{"id":11,"chapter":8,"verse":"启8:12","question":"日、月、星 是指：","answer":"- 日 : 七使者和所属其下的枝教会牧者们\n- 月 : 从牧者接受光之话语并传讲的传道者们\n- 星 : 圣徒们"},{"id":12,"chapter":8,"verse":"启8:12","question":"被击打:","answer":"七个金灯台帐幕被剥夺教权"},{"id":13,"chapter":8,"verse":"启8:12","question":"1/3黑暗了:","answer":"牧者和传道者, 圣徒 1/3不能说出真理"},{"id":14,"chapter":8,"verse":"启8:13","question":"鹰:","answer":"往来于灵界和肉界的天使长"},{"id":15,"chapter":8,"verse":"启8:13","question":"住在地上的人","answer":"违背神的言约被赶到外邦的七个金灯台帐幕圣徒们"},{"id":16,"chapter":8,"verse":"启8:13","question":"三个祸","answer":"七个中剩下的三个灾殃"}],"qaHard":[]}</script>

/* =====================================================================
 * 统一题库模型
 *   填空: { id, chapter, verse, question, answers[] }   question 里用全角（…）标出填空
 *   问答: { id, chapter, verse, question, answer }
 *   verse 内部只存节号部分（"8" / "17-18"），显示和导出统一为 "启8:8"
 *   所有来源（内置 / 本机 / 导入 / 界面编辑）都走同一套 normItem，格式永远一致
 * ===================================================================== */
const bankKey = (kind, diff) => kind + (diff === 'hard' ? 'Hard' : 'Easy');
const kindOfKey = k => k.startsWith('fill') ? 'fill' : 'qa';
const diffOfKey = k => k.endsWith('Hard') ? 'hard' : 'easy';

function parseVerse(chapter, verse) {
  let ch = Number(chapter) || 0;
  let v = verse == null ? '' : String(verse).replace(ZW, '').trim();
  const m = v.match(/^启?\s*(\d+)\s*[:：]\s*(.+)$/);
  if (m) { if (!ch) ch = +m[1]; v = m[2]; } else { v = v.replace(/^启\s*/, ''); }
  v = v.replace(/[~—–－～]/g, '-').replace(/\s+/g, '');
  return { chapter: ch, verse: v };
}
const verseLabel = q => q.chapter === 0 ? '全书通用' : (q.verse ? `启${q.chapter}:${q.verse}` : `启${q.chapter}`);
const verseKey = q => parseInt(q.verse, 10) || 0;
const cmpQ = (a, b) => a.chapter - b.chapter || verseKey(a) - verseKey(b) || (a.id ?? 0) - (b.id ?? 0);

/* 填空：把题目拆成 文本 / 填空 片段（全角括号才是填空；半角括号视为经文注释） */
function splitFill(text) {
  const segs = []; const re = /（([^）]+)）/g; let last = 0, m;
  while ((m = re.exec(text)) !== null) {
    if (m.index > last) segs.push({ t: 'text', v: text.slice(last, m.index) });
    segs.push({ t: 'blank', v: m[1].trim() });
    last = m.index + m[0].length;
  }
  if (last < text.length) segs.push({ t: 'text', v: text.slice(last) });
  return segs;
}
const extractBlanks = text => splitFill(text).filter(s => s.t === 'blank').map(s => s.v);
const fillPlain = text => splitFill(text).map(s => s.v).join('');
/* 兼容旧格式：题目里没有括号、只有 answers 列表时，按顺序把答案自动包成（…） */
function ensureBlanks(question, answers) {
  if (/（[^）]+）/.test(question) || !answers.length) return question;
  let out = '', pos = 0;
  for (const a of answers) {
    const i = question.indexOf(a, pos);
    if (i < 0) continue;
    out += question.slice(pos, i) + '（' + a + '）'; pos = i + a.length;
  }
  return out + question.slice(pos);
}

function normItem(kind, raw) {
  if (!raw || typeof raw !== 'object') return null;
  const { chapter, verse } = parseVerse(raw.chapter, raw.verse);
  let question = clean(raw.question ?? raw.text ?? '');
  if (!question || chapter < 0 || chapter > TOTAL_CHAPTERS) return null;
  if (chapter === 0 && kind !== 'qa') return null;   // 只有问答题允许“不限章节”
  const verse0 = chapter === 0 ? '' : verse;
  const idNum = raw.id === undefined || raw.id === null || raw.id === '' ? NaN : Number(raw.id);
  const id = Number.isFinite(idNum) ? idNum : null;
  if (kind === 'fill') {
    let answers = Array.isArray(raw.answers) ? raw.answers : Array.isArray(raw.answer) ? raw.answer
      : (typeof raw.answer === 'string' && raw.answer ? [raw.answer] : []);
    answers = answers.map(clean).filter(Boolean);
    question = ensureBlanks(question, answers);
    const blanks = extractBlanks(question);
    if (!blanks.length) return null;
    return { id, chapter, verse: verse0, question, answers: blanks };
  }
  let ans = raw.answer ?? raw.answers ?? '';
  if (Array.isArray(ans)) ans = ans.join('\n');
  return { id, chapter, verse: verse0, question, answer: clean(ans) };
}
const nextId = bank => bank.reduce((m, q) => Math.max(m, Number(q.id) || 0), 0) + 1;
function assignIds(list) {
  const used = new Set(); let max = list.reduce((m, q) => Math.max(m, q.id || 0), 0);
  list.forEach(q => { if (q.id == null || used.has(q.id)) q.id = ++max; used.add(q.id); });
}
function normBanks(data) {
  const out = { _updated: (data && data._updated) || '' };
  BANK_KEYS.forEach(k => {
    const arr = data && Array.isArray(data[k]) ? data[k] : [];
    const list = arr.map(r => normItem(kindOfKey(k), r)).filter(Boolean);
    assignIds(list); out[k] = list;
  });
  return out;
}
function exportItem(kind, q) {
  const base = { id: q.id, chapter: q.chapter, verse: verseLabel(q), question: q.question };
  return kind === 'fill' ? { ...base, answers: q.answers.slice() } : { ...base, answer: q.answer || '' };
}
function bankPayload() {
  const o = { _version: 2, _updated: new Date().toISOString() };
  BANK_KEYS.forEach(k => { o[k] = banks[k].slice().sort(cmpQ).map(q => exportItem(kindOfKey(k), q)); });
  return o;
}

/* ---------- 加载 / 保存（本机自动保存，避免刷新丢失） ---------- */
function readEmbedded() {
  try { return JSON.parse($('#__BANK_OVERRIDE__').textContent); } catch (e) { return null; }
}
let EMBEDDED = null;
let banks = normBanks(null);
function loadBanks() {
  EMBEDDED = normBanks(readEmbedded());
  let local = null;
  try { const t = localStorage.getItem(STORE_KEY); if (t) local = normBanks(JSON.parse(t)); } catch (e) {}
  /* 谁更新用谁：重新生成的离线文件比旧的本机缓存新 → 用文件内置；本机有更晚的编辑 → 用本机 */
  banks = (local && local._updated > EMBEDDED._updated) ? local : EMBEDDED;
}
function saveBanks() {
  banks._updated = new Date().toISOString();
  try { localStorage.setItem(STORE_KEY, JSON.stringify(bankPayload())); }
  catch (e) { toast('本机存储不可用，修改仅在本次打开期间有效，请及时导出备份', 'error'); }
}
const getBank = (kind, diff) => banks[bankKey(kind, diff)];

/* ---------- 题池 ---------- */
function dictPool() {
  const out = [], have = new Set(), seen = new Set();
  SCRIPTURE.forEach(([c, v, t]) => { have.add(c); out.push({ id: `s${c}:${v}`, chapter: c, verse: String(v), text: clean(t) }); });
  ['easy', 'hard'].forEach(d => getBank('fill', d).forEach(q => {
    if (have.has(q.chapter)) return;
    const key = q.chapter + ':' + q.verse; if (seen.has(key)) return; seen.add(key);
    out.push({ id: `f${d}${q.id}`, chapter: q.chapter, verse: q.verse, text: fillPlain(q.question) });
  }));
  return out;
}
function getPool(type, diff) {
  if (type === 'dict') return dictPool();
  return getBank(TYPES[type].kind, diff);
}
function chapterCounts(pool) {
  const c = {}; pool.forEach(q => { c[q.chapter] = (c[q.chapter] || 0) + 1; }); return c;
}

  if (s.chapter == null || !counts[s.chapter]) {
    const ks = Object.keys(counts).map(Number).sort((a, b) => a - b);
    s.chapter = ks.find(k => k > 0) ?? (ks.length ? ks[0] : null);   // 优先第一个有题的具体章节
    s.group = 'all';
  }

}
function planInfo() {
  const s = ui.setup, pool = getPool(s.type, s.diff);
  if (s.scope === 'random') return { n: Math.min(s.count, pool.length), total: pool.length };
  const total = s.chapter != null ? (chapterCounts(pool)[s.chapter] || 0) : 0;
  if (s.group === 'all') return { n: total, total };
  const g = Number(s.group); return { n: Math.max(0, Math.min(GROUP_SIZE, total - g * GROUP_SIZE)), total };
}

function buildQuestions() {
  const s = ui.setup;
  const pool = getPool(s.type, s.diff).slice();
  if (s.scope === 'random') return shuffle(pool).slice(0, s.count);
  const list = pool.filter(q => q.chapter === s.chapter).sort(cmpQ);
  if (s.group === 'all') return list;
  const g = Number(s.group); return list.slice(g * GROUP_SIZE, g * GROUP_SIZE + GROUP_SIZE);
}
function startSession() {

  if (!qs.length) { toast('当前范围没有题目', 'error'); return; }
  const total = s.scope === 'chapter' && s.chapter != null ? (chapterCounts(getPool(s.type, s.diff))[s.chapter] || 0) : 0;
  ui.session = {
    type: s.type, diff: s.diff, scope: s.scope, chapter: s.chapter, group: s.group,
    groupCount: Math.ceil(total / GROUP_SIZE), questions: qs, idx: 0, finished: false,

}

  const results = q.answers.map((a, i) => {
    const u = (user && user[i]) || '';

  });
  return { results, correct: results.filter(r => r.ok).length, total: results.length };
}

function lcsLen(a, b) {
  if (!a.length || !b.length) return 0;
  let prev = new Array(b.length + 1).fill(0);
  for (let i = 1; i <= a.length; i++) {
    const cur = new Array(b.length + 1).fill(0);
    for (let j = 1; j <= b.length; j++) cur[j] = a[i - 1] === b[j - 1] ? prev[j - 1] + 1 : Math.max(prev[j], cur[j - 1]);
    prev = cur;
  }

}

function checkDict(S, i) {
  const q = S.questions[i], n = dictPrefixLen(S, i);
  const prefix = q.text.slice(0, n), rest = q.text.slice(n), user = S.answers[i] || '';
  const a = normDict(rest), b = normDict(user);
  const acc = !a.length ? 100 : Math.round(lcsLen(a, b) / Math.max(a.length, b.length) * 100);
  return { prefix, rest, user, accuracy: acc, ok: acc >= 80 };
}
function scoreSession(S) {
  if (S.type === 'fill') {
    let c = 0, t = 0;
    S.questions.forEach((q, i) => { const r = checkFill(q, S.answers[i]); c += r.correct; t += r.total; });
    return { correct: c, total: t, pct: t ? Math.round(c / t * 100) : 0, unit: '空' };
  }
  if (S.type === 'dict') {
    let c = 0; S.questions.forEach((q, i) => { if (checkDict(S, i).ok) c++; });
    const t = S.questions.length; return { correct: c, total: t, pct: t ? Math.round(c / t * 100) : 0, unit: '节' };
  }

}

/* ---------- 填空题渲染（文本里的每个空 = 一个输入框；结果对照复用同一套片段） ---------- */
function fillInputsHtml(q, user, showAns) {
  let bi = 0;
  return splitFill(q.question).map(s => {
    if (s.t === 'text') return esc(s.v);
    const i = bi++, val = (user && user[i]) || '';
    let cls = 'blank';
    if (showAns) cls += normAns(val) === normAns(s.v) ? ' ok' : ' bad';
    const w = Math.min(Math.max(s.v.length * 1.1 + 1.4, 4), 22);
    return `<input class="${cls}" type="text" value="${esc(val)}" data-input="fill" data-i="${i}" style="width:${w}em"
      autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" enterkeyhint="next" aria-label="第 ${i + 1} 个空">`;
  }).join('');
}
function fillReviewHtml(q, user) {
  let bi = 0;
  return splitFill(q.question).map(s => {
    if (s.t === 'text') return esc(s.v);
    const i = bi++, u = (user && user[i]) || '';
    const ok = normAns(u) === normAns(s.v);
    if (ok) return `<span class="fb ok">${esc(s.v)}</span>`;
    return `<span class="fb bad">${u ? `<s>${esc(u)}</s>` : '<s>未填</s>'}${esc(s.v)}</span>`;

const VIEWS = { home: viewHome, setup: viewSetup, quiz: viewQuiz, result: viewResult, editor: viewEditor, form: viewForm };
const app = $('#app');
function guard(v) {

  if (v === 'setup' && ui.setup.type === 'qa' && !isUnlocked('qa')) return 'home';

  if (v === 'result') return S && S.finished ? 'result' : 'home';

function go(view, opts) {

/* =====================================================================
 * 导入 / 导出 / 离线文件
 * ===================================================================== */
function pickFile() {
  return new Promise((resolve, reject) => {
    const inp = document.createElement('input');
    inp.type = 'file'; inp.accept = '.txt,.json,application/json,text/plain'; inp.style.display = 'none';
    inp.onchange = () => {
      const f = inp.files && inp.files[0]; inp.remove();
      if (!f) return reject(new Error('未选择文件'));
      const r = new FileReader();
      r.onload = () => resolve({ name: f.name, text: String(r.result) });
      r.onerror = () => reject(r.error || new Error('读取文件失败'));
      r.readAsText(f, 'utf-8');
    };
    document.body.appendChild(inp); inp.click();
  });
}
function parseImportText(text) {
  let t = String(text || '').replace(/^\ufeff/, '').trim();
  if (!t) throw new Error('文件是空的');
  let data;
  try { data = JSON.parse(t); }
  catch (e) {
    try { data = JSON.parse('[' + t.replace(/^\[|\]$/g, '').replace(/}\s*{/g, '},{') + ']'); }
    catch (e2) { throw new Error('不是有效的 JSON。请确认是 [{...},{...}] 数组格式（可直接使用本页导出的文件）'); }
  }
  return data;
}
function mergeInto(kind, diff, arr) {
  const bank = getBank(kind, diff);
  const r = { add: 0, upd: 0, dup: 0, bad: 0 };
  (Array.isArray(arr) ? arr.flat(Infinity) : []).forEach(raw => {
    const item = normItem(kind, raw);
    if (!item) { r.bad++; return; }
    const idx = item.id != null ? bank.findIndex(b => b.id === item.id) : -1;
    if (idx >= 0) { bank[idx] = { ...item, id: bank[idx].id }; r.upd++; return; }
    if (bank.some(b => b.chapter === item.chapter && b.verse === item.verse && b.question === item.question)) { r.dup++; return; }
    if (item.id == null || bank.some(b => b.id === item.id)) item.id = nextId(bank);
    bank.push(item); r.add++;
  });
  return r;
}
async function doImport() {
  try {
    const { text } = await pickFile();
    const data = parseImportText(text);
    const E = ui.editor; const tot = { add: 0, upd: 0, dup: 0, bad: 0 };
    const acc = r => { for (const k in tot) tot[k] += r[k]; };
    if (Array.isArray(data)) acc(mergeInto(E.kind, E.diff, data));
    else if (data && BANK_KEYS.some(k => Array.isArray(data[k]))) BANK_KEYS.forEach(k => { if (Array.isArray(data[k])) acc(mergeInto(kindOfKey(k), diffOfKey(k), data[k])); });
    else if (data && Array.isArray(data.questions)) acc(mergeInto(E.kind, E.diff, data.questions));
    else acc(mergeInto(E.kind, E.diff, [data]));
    saveBanks(); render(true);
    toast(`导入完成：新增 ${tot.add}，更新 ${tot.upd}，重复跳过 ${tot.dup}` + (tot.bad ? `，无效 ${tot.bad}（章节须为 0–22（0=全书通用，仅问答题）；填空题须有章节且含全角（）空位）` : ''), tot.bad ? 'info' : 'success');
  } catch (e) {
    if (e && e.message === '未选择文件') return;
    toast('导入失败：' + (e.message || e), 'error');
  }
}

/* ---------- 导出图片：用 Canvas 自行排版绘制（不依赖第三方库，离线可用，不会出现文字错位） ---------- */
function exportCanvas(S) {
  const cs = getComputedStyle(document.documentElement), v = n => cs.getPropertyValue(n).trim();
  const C = { bg: v('--surface'), text: v('--text'), muted: v('--muted'), border: v('--border'), s2: v('--surface2'),
    ok: v('--ok'), bad: v('--bad'), okbg: v('--ok-bg'), badbg: v('--bad-bg'), note: v('--note-bg'), purple: v('--purple'), primary: v('--primary') };
  const FF = getComputedStyle(document.body).fontFamily;
  const W = 760, PAD = 28, IW = W - PAD * 2;
  const NO_START = '，。、；：！？）》」』”’,.;:!?)';
  let fs = 17;                                         // 当前段落字号（fontOf 使用）
  const STYLE = {                                      // st -> [粗体, 文字色, 背景色, 删除线]
    n: [0, C.text], b: [1, C.text], hint: [1, C.primary], mut: [0, C.muted],
    ok: [1, C.ok, C.okbg], bad: [1, C.bad, C.badbg], strike: [0, C.muted, C.badbg, 1]
  };
  const fontOf = st => `${STYLE[st][0] ? '700' : '400'} ${fs}px ${FF}`;
  const rr = (ctx, x, y, w, h, r, fill) => { ctx.beginPath(); ctx.roundRect ? ctx.roundRect(x, y, w, h, r) : ctx.rect(x, y, w, h); ctx.fillStyle = fill; ctx.fill(); };

  /* 段落：runs=[{t,st}]，逐字换行（中文友好，行首不放标点），返回占用高度 */
  function para(ctx, runs, x, y, w, size, lh, draw) {
    fs = size;
    const lines = []; let cur = [], cw = 0;
    for (const r of runs) for (const ch of Array.from(r.t)) {
      if (ch === '\n') { lines.push(cur); cur = []; cw = 0; continue; }
      if (ch === ' ' && !cur.length) continue;
      ctx.font = fontOf(r.st || 'n');
      const wd = ctx.measureText(ch).width;
      if (cw + wd > w && cur.length && !NO_START.includes(ch)) { lines.push(cur); cur = []; cw = 0; if (ch === ' ') continue; }
      cur.push({ ch, st: r.st || 'n', w: wd }); cw += wd;
    }
    lines.push(cur);
    if (draw) {
      ctx.textBaseline = 'middle'; ctx.textAlign = 'left';
      lines.forEach((ln, i) => {
        const cy = y + i * lh + lh / 2; let cx = x;
        for (let k = 0; k < ln.length;) {            // 先画连续同样式片段的背景
          let j = k, tw = 0; while (j < ln.length && ln[j].st === ln[k].st) { tw += ln[j].w; j++; }
          const bg = STYLE[ln[k].st][2];
          if (bg) rr(ctx, cx - 1, cy - size * 0.78, tw + 2, size * 1.56, 4, bg);
          cx += tw; k = j;
        }
        cx = x;
        for (const c of ln) {
          const [, col, , strike] = STYLE[c.st];
          ctx.font = fontOf(c.st); ctx.fillStyle = col; ctx.fillText(c.ch, cx, cy);
          if (strike) { ctx.fillRect(cx, cy, c.w, 1.2); }
          cx += c.w;
        }
      });
    }
    return lines.length * lh;
  }
  /* 带标签的面板（我的回答 / 参考答案 / 完整经文…） */
  function panel(ctx, label, runs, y, bg, bar, draw) {
    const inner = IW - 28, h = para(ctx, runs, 0, 0, inner, 15, 26, false) + 22 + 20;
    if (draw) {
      rr(ctx, PAD, y, IW, h, 10, bg);
      if (bar) rr(ctx, PAD, y, 4, h, 2, bar);
      ctx.font = `600 12px ${FF}`; ctx.fillStyle = C.muted; ctx.textBaseline = 'middle'; ctx.textAlign = 'left';
      ctx.fillText(label, PAD + 14, y + 17);
      para(ctx, runs, PAD + 14, y + 30, inner, 15, 26, true);
    }
    return h + 10;
  }
  const text = (ctx, str, x, y, font, color, align) => { ctx.font = font; ctx.fillStyle = color; ctx.textAlign = align || 'left'; ctx.textBaseline = 'middle'; ctx.fillText(str, x, y); };
  const R = (t, st) => ({ t, st });
  const fillRuns = (q, user) => {
    let bi = 0; const out = [];
    splitFill(q.question).forEach(sg => {
      if (sg.t === 'text') { out.push(R(sg.v, 'n')); return; }
      const i = bi++, u = (user && user[i]) || '';
      if (normAns(u) === normAns(sg.v)) out.push(R(sg.v, 'ok'));
      else { out.push(R(u || '未填', 'strike')); out.push(R(' ', 'bad')); out.push(R(sg.v, 'bad')); }
    });
    return out;
  };

  function layout(ctx, draw) {
    let y = PAD;
    const sc = scoreSession(S);
    if (draw) text(ctx, `${TYPES[S.type].label}完成 🎉`, W / 2, y + 16, `800 26px ${FF}`, C.text, 'center');
    y += 38;
    const sub = `${sessionTitle(S)} · 共 ${S.questions.length} 题` + (S.type === 'dict' ? '' : ` · 难度：${DIFF[S.diff]}`);
    if (draw) text(ctx, sub, W / 2, y + 10, `400 14px ${FF}`, C.muted, 'center');
    y += 30;
    if (sc) {
      if (draw) {
        rr(ctx, PAD, y, IW, 82, 12, C.s2);
        const col = sc.pct >= 60 ? C.ok : C.bad;
        text(ctx, '得分', W / 2 - 90, y + 24, `400 14px ${FF}`, C.text, 'center');
        text(ctx, `${sc.correct}/${sc.total}${sc.unit}`, W / 2 - 90, y + 55, `800 28px ${FF}`, col, 'center');
        text(ctx, '正确率', W / 2 + 90, y + 24, `400 14px ${FF}`, C.text, 'center');
        text(ctx, `${sc.pct}%`, W / 2 + 90, y + 55, `800 28px ${FF}`, col, 'center');
      }
      y += 82 + 14;
    }
    S.questions.forEach((q, i) => {
      if (draw) { ctx.fillStyle = C.border; ctx.fillRect(PAD, y, IW, 1); }
      y += 14;
      if (draw) text(ctx, `第 ${i + 1} 题 · ${verseLabel(q)}`, PAD, y + 9, `600 13px ${FF}`, C.muted);
      y += 24;
      if (S.type === 'fill') {
        y += para(ctx, fillRuns(q, S.answers[i]), PAD, y, IW, 17, 34, draw);
        const r = checkFill(q, S.answers[i]);
        if (draw) text(ctx, `得分 ${r.correct}/${r.total}`, PAD, y + 11, `400 13px ${FF}`, r.correct === r.total ? C.ok : C.bad);
        y += 28;
      } else if (S.type === 'qa') {
        y += para(ctx, [R(q.question, 'b')], PAD, y, IW, 17, 30, draw) + 8;
        y += panel(ctx, '我的回答', [R(S.answers[i] || '（未作答）', S.answers[i] ? 'n' : 'mut')], y, C.s2, null, draw);
        y += panel(ctx, '参考答案', [R(q.answer || '（暂无参考答案）', q.answer ? 'n' : 'mut')], y, C.note, C.purple, draw);
        y += 6;
      } else {
        const r = checkDict(S, i);
        if (draw) text(ctx, `${r.ok ? '✅ 默写正确' : '❌ 默写有误'} · 准确率 ${r.accuracy}%`, PAD, y + 9, `600 14px ${FF}`, r.ok ? C.ok : C.bad);
        y += 24;
        y += panel(ctx, '完整经文', [R(r.prefix, 'hint'), R(r.rest, 'n')], y, C.s2, null, draw);
        y += panel(ctx, '我的默写', [R(r.prefix, 'hint'), R(r.user || '（未填写）', r.user ? 'n' : 'mut')], y, C.s2, null, draw);
        y += 6;
      }
    });
    if (draw) text(ctx, `蓬勃 · 启示录训练　${today()}`, W / 2, y + 12, `400 12px ${FF}`, C.muted, 'center');
    return y + 36;
  }
  /* 第一遍只量高度，第二遍真正绘制 */
  const probe = document.createElement('canvas').getContext('2d');
  const H = Math.ceil(layout(probe, false));
  const scale = Math.max(0.5, Math.min(2, 16000 / H));
  const cv = document.createElement('canvas');
  cv.width = Math.round(W * scale); cv.height = Math.round(H * scale);
  const ctx = cv.getContext('2d'); ctx.scale(scale, scale);
  ctx.fillStyle = C.bg; ctx.fillRect(0, 0, W, H);
  layout(ctx, true);
  return cv;
}
async function exportImage() {
  try {

    const name = `${TYPES[S.type].label}结果_${today()}.png`;
    const file = new File([blob], name, { type: 'image/png' });

    }
    download(blob, name); toast('图片已保存', 'success');
  } catch (e) {
    console.warn(e); toast('图片生成失败，已改用打印 / 另存为 PDF');
    setTimeout(() => window.print(), 500);
  }
}

/* =====================================================================
 * 编辑器：保存表单
 * ===================================================================== */
function updatePreview() {
  const t = $('#fQuestion'), p = $('#blankPreview');
  if (t && p) p.innerHTML = previewBlanksHtml(t.value);
}
function saveForm() {
  const E = ui.editor, kind = E.kind;
  const chSel = Number($('#fChapter').value) || 0;
  const pv = chSel === 0 ? { chapter: 0, verse: '' } : parseVerse(chSel, $('#fVerse').value.trim());   // 不限章节时忽略节号
  const { chapter, verse } = pv;
  const question = clean($('#fQuestion').value);
  if (!question) { toast('题目内容不能为空', 'error'); return; }
  let obj;
  if (kind === 'fill') {
    const answers = extractBlanks(question);
    if (!answers.length) { toast('请用全角括号（…）至少标出 1 个填空', 'error'); return; }
    obj = { chapter, verse, question, answers };
  } else {
    obj = { chapter, verse, question, answer: clean($('#fAnswer').value) };
  }
  const bank = getBank(kind, E.diff);
  const idx = E.editingId == null ? -1 : bank.findIndex(x => x.id === E.editingId);
  if (idx >= 0) { obj.id = bank[idx].id; bank[idx] = obj; toast('已保存修改', 'success'); }
  else { obj.id = nextId(bank); bank.push(obj); toast('已新建 1 题', 'success'); }
  if (chapter > 0) E.lastChapter = chapter;
  E.formOpen = false; E.editingId = null;
  saveBanks(); go('editor', { replace: true });
}

/* =====================================================================
 * 事件（统一委托）
 * ===================================================================== */
const S_ = () => ui.session;
const ACT = {
  go: d => { if (d.view === 'editor') askPassword('editor', () => go('editor')); else go(d.view); },
  openType: d => {
    const open = () => { ui.setup.type = d.type; ui.setup.chapter = null; ui.setup.group = 'all'; go('setup'); };
    if (d.type === 'qa') askPassword('qa', open); else open();
  },
  lockEditor: () => { setUnlocked('editor', false); ui.editor.formOpen = false; go('home'); toast('已锁定题库编辑'); },
  setDiff: d => { ui.setup.diff = d.v; ui.setup.chapter = null; ui.setup.group = 'all'; render(true); },
  setScope: d => { ui.setup.scope = d.v; render(true); },
  start: () => startSession(),
  toggleAnswer: () => { const S = S_(); S.shown[S.idx] = !S.shown[S.idx]; render(true); },
  prev: () => { const S = S_(); if (S.idx > 0) { S.idx--; render(); } },
  next: () => { const S = S_(); if (S.idx < S.questions.length - 1) { S.idx++; render(); } },
  finish: () => { S_().finished = true; go('result'); },
  moreHint: () => { const S = S_(); S.hints[S.idx]++; render(true); },
  again: () => startSession(),
  nextGroup: () => { ui.setup.group = Number(ui.session.group) + 1; startSession(); },
  exportImage: () => exportImage(),
  /* 编辑器 */
  edKind: d => { Object.assign(ui.editor, { kind: d.v, page: 1, filter: '' }); render(true); },
  edDiff: d => { Object.assign(ui.editor, { diff: d.v, page: 1 }); render(true); },
  edPage: d => { ui.editor.page = Number(d.p); render(); },
  edNew: () => { Object.assign(ui.editor, { editingId: null, formOpen: true }); go('form'); },
  edEdit: d => { Object.assign(ui.editor, { editingId: Number(d.id), formOpen: true }); go('form'); },
  edDup: d => {
    const E = ui.editor, bank = getBank(E.kind, E.diff), src = bank.find(q => q.id === Number(d.id)); if (!src) return;
    const copy = JSON.parse(JSON.stringify(src)); copy.id = nextId(bank); bank.push(copy);
    saveBanks(); render(true); toast('已复制题目（新 id #' + copy.id + '）', 'success');
  },
  edDel: d => {
    const E = ui.editor, bank = getBank(E.kind, E.diff), i = bank.findIndex(q => q.id === Number(d.id)); if (i < 0) return;
    if (!confirm('确定删除这道题？\n' + truncate(bank[i].question, 40))) return;
    bank.splice(i, 1); saveBanks(); render(true); toast('已删除');
  },
  edImport: () => doImport(),
  edExport: () => exportCurrent(),
  edExportAll: () => exportAll(),
  edOffline: () => exportOffline(),
  edReset: () => {
    if (!confirm('将丢弃本机上所有修改，恢复为当前文件内置的题库。确定吗？')) return;
    try { localStorage.removeItem(STORE_KEY); } catch (e) {}
    banks = normBanks(readEmbedded()); render(true); toast('已恢复为文件内置题库', 'success');
  },
  formCancel: () => { ui.editor.formOpen = false; ui.editor.editingId = null; go('editor', { replace: true }); },
  formSave: () => saveForm(),
  fMark: () => {
    const t = $('#fQuestion'), s = t.selectionStart, e = t.selectionEnd;
    if (s === e) { toast('请先在题目中选中要挖空的文字'); return; }
    t.value = t.value.slice(0, s) + '（' + t.value.slice(s, e) + '）' + t.value.slice(e);
    t.focus(); t.setSelectionRange(s, e + 2); updatePreview();
  },
  fUnmark: () => { const t = $('#fQuestion'); t.value = t.value.replace(/（([^）]*)）/g, '$1'); updatePreview(); }
};
const CHG = {
  setChapter: v => { ui.setup.chapter = Number(v); ui.setup.group = 'all'; render(true); },
  setGroup: v => { ui.setup.group = v; render(true); },
  setCount: v => { ui.setup.count = Number(v); render(true); }
};
const INP = {
  fill: (el) => { const S = S_(); if (!Array.isArray(S.answers[S.idx])) S.answers[S.idx] = []; S.answers[S.idx][Number(el.dataset.i)] = el.value; },
  text: (el) => { const S = S_(); S.answers[S.idx] = el.value; },
  fQuestion: () => updatePreview(),
  edSearch: (el) => {
    ui.editor.filter = el.value; ui.editor.page = 1;
    const list = editorFiltered().slice(0, PAGE_SIZE);
    $('#edList').innerHTML = list.length ? list.map(editorRow).join('') : '<div class="empty">无匹配结果</div>';
  }
};
app.addEventListener('click', e => {
  const el = e.target.closest('[data-act]');
  if (el && !el.disabled && ACT[el.dataset.act]) ACT[el.dataset.act](el.dataset, el);
});
app.addEventListener('change', e => {
  const el = e.target.closest('[data-change]');
  if (el && CHG[el.dataset.change]) CHG[el.dataset.change](el.value, el);
});
app.addEventListener('input', e => {
  const el = e.target.closest('[data-input]');
  if (el && INP[el.dataset.input]) INP[el.dataset.input](el);
});
app.addEventListener('keydown', e => {
  if (e.key !== 'Enter' || e.isComposing || e.keyCode === 229) return;
  const el = e.target;
  if (el.classList && el.classList.contains('blank')) {          // 回车跳到下一个空
    e.preventDefault();
    const all = Array.from(app.querySelectorAll('.blank')), i = all.indexOf(el);
    if (i >= 0 && i < all.length - 1) all[i + 1].focus(); else el.blur();
  }
});

/* ---------- 顶栏 / 主题 ---------- */
function applyTheme(t) {
  document.documentElement.dataset.theme = t;
  $('#themeBtn').textContent = t === 'dark' ? '☀️' : '🌙';
}
$('#themeBtn').addEventListener('click', () => {
  const t = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark';
  applyTheme(t); try { localStorage.setItem(THEME_KEY, t); } catch (e) {}
});
$('#homeBtn').addEventListener('click', () => go('home'));
$('#brandBtn').addEventListener('click', () => go('home'));

/* ---------- 启动 ---------- */
(function init() {
  let t = null; try { t = localStorage.getItem(THEME_KEY); } catch (e) {}
  applyTheme(t || (window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'));
  loadBanks();
  try { history.replaceState({ view: 'home' }, ''); } catch (e) {}
  render();
})();
</script>
</body>
